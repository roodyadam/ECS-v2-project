name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

concurrency:
  group: destroy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.5.0
  TF_STATE_BUCKET: ecs-v2-terraform-state-roodyadams-88975-eu-west-2

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation input
        run: |
          if [[ ! "${{ inputs.confirm_destroy }}" =~ ^[[:space:]]*destroy[[:space:]]*$ ]]; then
            echo "::error::Invalid confirmation. You must type 'destroy' to proceed."
            echo "::error::Received: '${{ inputs.confirm_destroy }}'"
            exit 1
          fi
          echo "✓ Confirmation validated"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Clear stale Terraform lock
        working-directory: ./infra/envs/dev
        run: |
          set +e
          LOCK_ID="envs/dev/terraform.tfstate"
          FULL_LOCK_ID="${{ env.TF_STATE_BUCKET }}/envs/dev/terraform.tfstate"
          for lock in "$LOCK_ID" "$FULL_LOCK_ID"; do
            aws dynamodb get-item \
              --region ${{ env.AWS_REGION }} \
              --table-name terraform-state-lock \
              --key "{\"LockID\":{\"S\":\"$lock\"}}" \
              --query 'Item' \
              --output text >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              aws dynamodb delete-item \
                --region ${{ env.AWS_REGION }} \
                --table-name terraform-state-lock \
                --key "{\"LockID\":{\"S\":\"$lock\"}}" || true
              echo "Cleared lock: $lock"
            fi
          done

      - name: Pre-destroy plan
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Generating destroy plan to show what will be destroyed..."
          terraform plan -destroy -out=tfplan || {
            echo "::warning::Plan generation failed, but continuing with destroy..."
          }

      - name: Get ALB ARN from Terraform
        working-directory: ./infra/envs/dev
        id: alb_arn
        continue-on-error: true
        run: |
          ALB_ARN=$(terraform output -raw alb_arn 2>/dev/null || echo "")
          if [ -z "$ALB_ARN" ]; then
            echo "No ALB found in Terraform state (may already be destroyed)"
            echo "alb_arn=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "alb_arn=$ALB_ARN" >> $GITHUB_OUTPUT
          echo "Found ALB ARN: $ALB_ARN"

      - name: Disable ALB deletion protection
        continue-on-error: true
        run: |
          ALB_ARN="${{ steps.alb_arn.outputs.alb_arn }}"
          if [ -z "$ALB_ARN" ]; then
            echo "No ALB ARN available, skipping deletion protection disable"
            exit 0
          fi
          echo "Disabling deletion protection for ALB: $ALB_ARN"
          aws elbv2 modify-load-balancer-attributes \
            --region ${{ env.AWS_REGION }} \
            --load-balancer-arn "$ALB_ARN" \
            --attributes Key=deletion_protection.enabled,Value=false || true
          echo "✓ Disabled deletion protection for ALB"

      - name: Destroy ALB and related resources first
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Destroying ALB and related resources..."
          terraform destroy \
            -target=module.alb.aws_lb.main \
            -target=module.alb.aws_lb_listener.main \
            -target=module.alb.aws_lb_target_group.blue \
            -target=module.alb.aws_lb_target_group.green \
            -target=module.alb.aws_security_group.alb \
            -auto-approve -input=false || true

      - name: Wait for ALB deletion to propagate
        continue-on-error: true
        run: |
          ALB_ARN="${{ steps.alb_arn.outputs.alb_arn }}"
          if [ -z "$ALB_ARN" ]; then
            echo "No ALB ARN available, skipping wait"
            exit 0
          fi
          
          MAX_WAIT=300
          ELAPSED=0
          INTERVAL=5
          
          echo "Waiting for ALB deletion to propagate (max ${MAX_WAIT}s)..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALB_EXISTS=$(aws elbv2 describe-load-balancers \
              --region ${{ env.AWS_REGION }} \
              --load-balancer-arns "$ALB_ARN" \
              --query "length(LoadBalancers)" \
              --output text 2>/dev/null || echo "0")
            
            if [ "$ALB_EXISTS" == "0" ] || [ -z "$ALB_EXISTS" ]; then
              echo "✓ ALB deletion confirmed"
              exit 0
            fi
            
            echo "  ALB still exists, waiting... (${ELAPSED}s/${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "::warning::ALB deletion propagation timeout, but continuing..."

      - name: Destroy route tables and VPC endpoints
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Destroying route tables, associations, and VPC endpoints..."
          terraform destroy \
            -target=module.vpc.aws_vpc_endpoint.s3 \
            -target=module.vpc.aws_vpc_endpoint.dynamodb \
            -target=module.vpc.aws_vpc_endpoint.ecr_api \
            -target=module.vpc.aws_vpc_endpoint.ecr_dkr \
            -target=module.vpc.aws_vpc_endpoint.logs \
            -target=module.vpc.aws_route_table_association.public \
            -target=module.vpc.aws_route_table.public \
            -target=module.vpc.aws_route_table_association.private \
            -target=module.vpc.aws_route_table.private \
            -auto-approve -input=false || true

      - name: Wait for route table deletion to propagate
        continue-on-error: true
        run: |
          MAX_WAIT=60
          ELAPSED=0
          INTERVAL=5
          
          echo "Waiting for route table deletion to propagate (max ${MAX_WAIT}s)..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            echo "  Waiting for AWS propagation... (${ELAPSED}s/${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "✓ Propagation wait completed"

      - name: Terraform Destroy
        working-directory: ./infra/envs/dev
        run: |
          echo "::notice::Starting full infrastructure destruction..."
          terraform destroy -auto-approve -input=false
          echo "::notice::Infrastructure destruction completed"

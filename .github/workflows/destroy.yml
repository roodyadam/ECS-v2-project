name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

concurrency:
  group: destroy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.5.0
  TF_STATE_BUCKET: ecs-v2-terraform-state-roodyadams-88975-eu-west-2

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation input
        run: |
          if [[ ! "${{ inputs.confirm_destroy }}" =~ ^[[:space:]]*destroy[[:space:]]*$ ]]; then
            echo "::error::Invalid confirmation. You must type 'destroy' to proceed."
            echo "::error::Received: '${{ inputs.confirm_destroy }}'"
            exit 1
          fi
          echo "✓ Confirmation validated"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Clear stale Terraform lock
        working-directory: ./infra/envs/dev
        run: |
          set +e
          LOCK_ID="envs/dev/terraform.tfstate"
          FULL_LOCK_ID="${{ env.TF_STATE_BUCKET }}/envs/dev/terraform.tfstate"
          for lock in "$LOCK_ID" "$FULL_LOCK_ID"; do
            aws dynamodb get-item \
              --region ${{ env.AWS_REGION }} \
              --table-name terraform-state-lock \
              --key "{\"LockID\":{\"S\":\"$lock\"}}" \
              --query 'Item' \
              --output text >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              aws dynamodb delete-item \
                --region ${{ env.AWS_REGION }} \
                --table-name terraform-state-lock \
                --key "{\"LockID\":{\"S\":\"$lock\"}}" || true
              echo "Cleared lock: $lock"
            fi
          done

      - name: Get ALB ARN from Terraform
        working-directory: ./infra/envs/dev
        id: alb_arn
        continue-on-error: true
        run: |
          ALB_ARN=$(terraform output -raw alb_arn 2>/dev/null || echo "")
          if [ -z "$ALB_ARN" ]; then
            echo "No ALB found in Terraform state (may already be destroyed)"
            echo "alb_arn=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "alb_arn=$ALB_ARN" >> $GITHUB_OUTPUT
          echo "Found ALB ARN: $ALB_ARN"

      - name: Disable ALB deletion protection
        continue-on-error: true
        run: |
          ALB_ARN="${{ steps.alb_arn.outputs.alb_arn }}"
          if [ -z "$ALB_ARN" ]; then
            echo "No ALB ARN available, skipping deletion protection disable"
            exit 0
          fi
          echo "Disabling deletion protection for ALB: $ALB_ARN"
          aws elbv2 modify-load-balancer-attributes \
            --region ${{ env.AWS_REGION }} \
            --load-balancer-arn "$ALB_ARN" \
            --attributes Key=deletion_protection.enabled,Value=false || true
          echo "✓ Disabled deletion protection for ALB"

      - name: Destroy ALB and wait for ENIs to be released
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Destroying ALB (releases public IPs from ENIs)..."
          terraform destroy -target=module.alb.aws_lb.main \
            -auto-approve -input=false || true
          
          ALB_ARN="${{ steps.alb_arn.outputs.alb_arn }}"
          if [ -n "$ALB_ARN" ]; then
            echo "::notice::Waiting for ALB ENIs to be released..."
            for i in {1..12}; do
              STATUS=$(aws elbv2 describe-load-balancers \
                --region ${{ env.AWS_REGION }} \
                --load-balancer-arns "$ALB_ARN" \
                --query 'LoadBalancers[0].State.Code' \
                --output text 2>/dev/null || echo "not-found")
              if [ "$STATUS" == "not-found" ] || [ "$STATUS" == "None" ]; then
                echo "✓ ALB deleted, ENIs released"
                break
              fi
              sleep 10
            done
          fi
          sleep 10

      - name: Wait for all ENIs with public IPs to be released
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Checking for ENIs with public IPs in VPC..."
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
          if [ -z "$VPC_ID" ]; then
            echo "VPC ID not found, skipping ENI check"
            exit 0
          fi
          
          echo "Waiting for all ENIs with public IPs to be released..."
          for i in {1..30}; do
            ENIS_WITH_PUBLIC_IP=$(aws ec2 describe-network-interfaces \
              --region ${{ env.AWS_REGION }} \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=association.public-ip,Values=*" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$ENIS_WITH_PUBLIC_IP" ] || [ "$ENIS_WITH_PUBLIC_IP" == "None" ]; then
              echo "✓ All ENIs with public IPs released"
              break
            fi
            
            ENI_COUNT=$(echo "$ENIS_WITH_PUBLIC_IP" | wc -w)
            echo "Found $ENI_COUNT ENI(s) with public IPs, waiting... (attempt $i/30)"
            sleep 10
          done
          
          REMAINING_ENIS=$(aws ec2 describe-network-interfaces \
            --region ${{ env.AWS_REGION }} \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=association.public-ip,Values=*" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$REMAINING_ENIS" ] && [ "$REMAINING_ENIS" != "None" ]; then
            echo "::warning::Some ENIs with public IPs still exist, but proceeding..."
          fi
          sleep 5

      - name: Destroy route before IGW
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Destroying route that references IGW..."
          terraform destroy -target=module.vpc.aws_route.public_internet \
            -auto-approve -input=false || true
          sleep 5

      - name: Terraform Destroy
        working-directory: ./infra/envs/dev
        run: terraform destroy -auto-approve -input=false

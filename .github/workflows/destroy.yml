name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

concurrency:
  group: destroy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.5.0
  TF_STATE_BUCKET: ecs-v2-terraform-state-roodyadams-88975-eu-west-2

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation input
        run: |
          if [[ ! "${{ inputs.confirm_destroy }}" =~ ^[[:space:]]*destroy[[:space:]]*$ ]]; then
            echo "::error::Invalid confirmation. You must type 'destroy' to proceed."
            echo "::error::Received: '${{ inputs.confirm_destroy }}'"
            exit 1
          fi
          echo "✓ Confirmation validated"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Clear stale Terraform lock
        working-directory: ./infra/envs/dev
        run: |
          set +e
          LOCK_ID="envs/dev/terraform.tfstate"
          FULL_LOCK_ID="${{ env.TF_STATE_BUCKET }}/envs/dev/terraform.tfstate"
          for lock in "$LOCK_ID" "$FULL_LOCK_ID"; do
            aws dynamodb get-item \
              --region ${{ env.AWS_REGION }} \
              --table-name terraform-state-lock \
              --key "{\"LockID\":{\"S\":\"$lock\"}}" \
              --query 'Item' \
              --output text >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              aws dynamodb delete-item \
                --region ${{ env.AWS_REGION }} \
                --table-name terraform-state-lock \
                --key "{\"LockID\":{\"S\":\"$lock\"}}" || true
              echo "Cleared lock: $lock"
            fi
          done

      - name: Destroy in order
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "Step 1: Destroying ALB (releases ENIs and public IPs)..."
          terraform destroy -target=module.alb -auto-approve -input=false || true
          sleep 60
          
          echo "Step 2: Destroying ECS service..."
          terraform destroy -target=module.ecs -auto-approve -input=false || true
          sleep 30
          
          echo "Step 3: Destroying route..."
          terraform destroy -target=module.vpc.aws_route.public_internet \
            -auto-approve -input=false || true
          sleep 10

      - name: Terraform Destroy (remaining resources)
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          echo "::notice::Destroying route that references IGW..."
          terraform destroy -target=module.vpc.aws_route.public_internet \
            -auto-approve -input=false || true
          sleep 5

      - name: Terraform Destroy
        working-directory: ./infra/envs/dev
        run: terraform destroy -auto-approve -input=false

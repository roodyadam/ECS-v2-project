name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

concurrency:
  group: destroy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.5.0
  TF_STATE_BUCKET: ecs-v2-terraform-state-roodyadams-88975-eu-west-2

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        run: |
          if [[ ! "${{ inputs.confirm_destroy }}" =~ ^[[:space:]]*destroy[[:space:]]*$ ]]; then
            echo "::error::Invalid confirmation. You must type 'destroy' to proceed."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Clear stale lock
        working-directory: ./infra/envs/dev
        run: |
          for lock in "envs/dev/terraform.tfstate" "${{ env.TF_STATE_BUCKET }}/envs/dev/terraform.tfstate"; do
            aws dynamodb delete-item \
              --region ${{ env.AWS_REGION }} \
              --table-name terraform-state-lock \
              --key "{\"LockID\":{\"S\":\"$lock\"}}" 2>/dev/null || true
          done

      - name: Destroy resources in order
        working-directory: ./infra/envs/dev
        continue-on-error: true
        run: |
          set +e
          terraform destroy -target=module.alb -auto-approve -input=false
          sleep 60
          terraform destroy -target=module.ecs -auto-approve -input=false
          sleep 30
          terraform destroy -target=module.vpc.aws_route.public_internet -auto-approve -input=false
          sleep 10

      - name: Terraform Destroy
        working-directory: ./infra/envs/dev
        run: terraform destroy -auto-approve -input=false

name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.0

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS_ROLE_ARN secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::warning::AWS_ROLE_ARN secret is not set. Terraform plan will be skipped."
            echo "::warning::Set up the secret after initial infrastructure deployment."
            echo "secret_exists=false" >> $GITHUB_OUTPUT
          else
            echo "secret_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-secret.outputs.secret_exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.check-secret.outputs.secret_exists == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        if: steps.check-secret.outputs.secret_exists == 'true'
        working-directory: ./infra/envs/dev
        run: terraform init

      - name: Terraform Format Check
        if: steps.check-secret.outputs.secret_exists == 'true'
        working-directory: ./infra/envs/dev
        run: terraform fmt -check

      - name: Terraform Validate
        if: steps.check-secret.outputs.secret_exists == 'true'
        working-directory: ./infra/envs/dev
        run: terraform validate

      - name: Terraform Plan
        if: steps.check-secret.outputs.secret_exists == 'true'
        working-directory: ./infra/envs/dev
        run: terraform plan -out=tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS_ROLE_ARN secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN secret is not set!"
            echo "::error::For initial deployment, you must:"
            echo "::error::1. Deploy infrastructure manually: cd infra/envs/dev && terraform apply"
            echo "::error::2. Get role ARN: terraform output github_deploy_role_arn"
            echo "::error::3. Add it as GitHub secret: AWS_ROLE_ARN"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infra/envs/dev
        run: terraform apply -auto-approve


  codedeploy-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: get-outputs
        working-directory: ./infra/envs/dev
        run: |
          CD_APP=$(terraform output -raw codedeploy_app_name)
          CD_GROUP=$(terraform output -raw codedeploy_deployment_group_name)
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(terraform output -raw ecs_service_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "cd_app=$CD_APP" >> $GITHUB_OUTPUT
          echo "cd_group=$CD_GROUP" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Verify ECR image exists
        run: |
          NEW_IMAGE="${{ steps.get-outputs.outputs.ecr_url }}:${{ github.sha }}"
          echo "Checking if image exists: $NEW_IMAGE"
          IMAGE_REPO=$(echo "$NEW_IMAGE" | cut -d: -f1 | sed 's|.*/||')
          IMAGE_TAG=$(echo "$NEW_IMAGE" | cut -d: -f2)
          aws ecr describe-images --repository-name $IMAGE_REPO --image-ids imageTag=$IMAGE_TAG --query 'imageDetails[0].imageTags' --output json || {
            echo "::error::Image $NEW_IMAGE not found in ECR. Make sure CI workflow completed successfully."
            exit 1
          }
          echo "✓ Image found in ECR"

      - name: Get current task definition
        id: get-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services --cluster ${{ steps.get-outputs.outputs.cluster_name }} --services ${{ steps.get-outputs.outputs.service_name }} --query 'services[0].taskDefinition' --output text)
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $TASK_DEF_ARN --query 'taskDefinition' --output json)
          NEW_IMAGE="${{ steps.get-outputs.outputs.ecr_url }}:${{ github.sha }}"
          echo "Updating task definition with image: $NEW_IMAGE"
          TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE')
          TASK_DEF=$(echo $TASK_DEF | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          echo "$TASK_DEF" > task-definition.json
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "New image will be: $NEW_IMAGE"

      - name: Register new task definition
        id: register-task-def
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "new_task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Prepare AppSpec file
        run: |
          sed "s|<TASK_DEFINITION>|${{ steps.register-task-def.outputs.new_task_def_arn }}|g" appspec.yml > appspec-final.yml
          echo "AppSpec file prepared:"
          cat appspec-final.yml

      - name: Create CodeDeploy deployment
        run: |
          # Base64 encode without line breaks (Linux uses -w 0, macOS uses no flag)
          APPSPEC_B64=$(cat appspec-final.yml | base64 -w 0 2>/dev/null || cat appspec-final.yml | base64 | tr -d '\n')
          aws deploy create-deployment \
            --application-name ${{ steps.get-outputs.outputs.cd_app }} \
            --deployment-group-name ${{ steps.get-outputs.outputs.cd_group }} \
            --revision revisionType=AppSpecContent,appSpecContent="{content=$APPSPEC_B64}" \
            --description "Deployment triggered by GitHub Actions - Commit ${{ github.sha }}"

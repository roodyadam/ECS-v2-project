name: cd

on:
  workflow_run:
    workflows: ["Final process of the project"]
    types:
      - completed
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.5.0

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Final process of the project' &&
      github.event.workflow_run.head_branch == 'main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Validate AWS_ROLE_ARN secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN secret is not set!"
            echo "::error::For initial deployment, you must:"
            echo "::error::1. Deploy infrastructure manually: cd infra/envs/dev && terraform apply"
            echo "::error::2. Get role ARN: terraform output github_deploy_role_arn"
            echo "::error::3. Add it as GitHub secret: AWS_ROLE_ARN"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init

      - name: Create terraform.tfvars
        working-directory: ./infra/envs/dev
        run: |
          cat > terraform.tfvars << EOF
          project_name = "url-shortener"
          aws_region   = "eu-west-2"
          vpc_cidr     = "10.0.0.0/16"
          ecs_desired_count = 2
          EOF
          echo "Created terraform.tfvars:"
          cat terraform.tfvars

      - name: Clear stale Terraform lock if older than 10 minutes
        shell: bash
        working-directory: ./infra/envs/dev
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set +e
          LOCK_TABLE="terraform-state-lock"
          STATE_PATH="envs/dev/terraform.tfstate"
          echo "Checking for Terraform lock in table '$LOCK_TABLE' for '$STATE_PATH' (region: $AWS_REGION)"
          aws sts get-caller-identity --region "$AWS_REGION" >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "AWS credentials not available yet; skipping stale lock check."
            exit 0
          fi
          aws dynamodb describe-table --region "$AWS_REGION" --table-name "$LOCK_TABLE" >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "Lock table '$LOCK_TABLE' not found in $AWS_REGION; skipping."
            exit 0
          fi
          ITEM_LEN=$(aws dynamodb get-item \
            --region "$AWS_REGION" \
            --table-name "$LOCK_TABLE" \
            --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}" \
            --query 'length(Item)' \
            --output text 2>/dev/null || echo "0")
          if [ "$ITEM_LEN" = "0" ] || [ "$ITEM_LEN" = "None" ]; then
            echo "No lock item found."
            exit 0
          fi
          echo "Lock item exists. Deleting it to unblock apply..."
          aws dynamodb delete-item \
            --region "$AWS_REGION" \
            --table-name "$LOCK_TABLE" \
            --key "{\"LockID\":{\"S\":\"$STATE_PATH\"}}"
          if [ $? -eq 0 ]; then
            echo "✓ Deleted lock for '$STATE_PATH'."
          else
            echo "Could not delete lock; proceeding and letting terraform handle lock-timeout."
          fi

      - name: Terraform Apply
        working-directory: ./infra/envs/dev
        run: terraform apply -auto-approve -input=false -lock=false


  codedeploy-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: ${{ needs.terraform-apply.result == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra/envs/dev
        run: terraform init

      - name: Get infrastructure outputs
        id: get-outputs
        working-directory: ./infra/envs/dev
        run: |
          CD_APP=$(terraform output -raw codedeploy_app_name)
          CD_GROUP=$(terraform output -raw codedeploy_deployment_group_name)
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(terraform output -raw ecs_service_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "cd_app=$CD_APP" >> $GITHUB_OUTPUT
          echo "cd_group=$CD_GROUP" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Verify ECR image exists
        id: verify-image
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$COMMIT_SHA" ]; then
            echo "::error::Cannot determine commit SHA. This job should only run after CI workflow completes."
            exit 1
          fi
          
          NEW_IMAGE="${{ steps.get-outputs.outputs.ecr_url }}:$COMMIT_SHA"
          echo "Checking if image exists: $NEW_IMAGE"
          echo "Looking for commit SHA: $COMMIT_SHA (from CI workflow)"
          IMAGE_REPO=$(echo "$NEW_IMAGE" | cut -d: -f1 | sed 's|.*/||')
          IMAGE_TAG=$(echo "$NEW_IMAGE" | cut -d: -f2)
          
          if aws ecr describe-images --repository-name $IMAGE_REPO --image-ids imageTag=$IMAGE_TAG --query 'imageDetails[0].imageTags' --output json 2>/dev/null; then
            echo "✓ Image found in ECR with tag: $IMAGE_TAG"
          else
            echo "::error::Image with tag $IMAGE_TAG not found in ECR."
            echo "::error::Expected image: $NEW_IMAGE"
            echo "::error::This means CI workflow may not have pushed the image successfully."
            echo "::error::Please check the CI workflow logs to ensure the image was pushed."
            exit 1
          fi
          echo "Using image: $NEW_IMAGE"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=$NEW_IMAGE" >> $GITHUB_OUTPUT

      - name: Get current task definition
        id: get-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services --cluster ${{ steps.get-outputs.outputs.cluster_name }} --services ${{ steps.get-outputs.outputs.service_name }} --query 'services[0].taskDefinition' --output text)
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $TASK_DEF_ARN --query 'taskDefinition' --output json)
          NEW_IMAGE="${{ steps.verify-image.outputs.image_uri }}"
          echo "Updating task definition with image: $NEW_IMAGE"
          TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE')
          TASK_DEF=$(echo $TASK_DEF | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          echo "$TASK_DEF" > task-definition.json
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "New image will be: $NEW_IMAGE"

      - name: Register new task definition
        id: register-task-def
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "new_task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Prepare AppSpec file (YAML, no indentation)
        id: make-appspec
        env:
          NEW_TASK_DEF_ARN: ${{ steps.register-task-def.outputs.new_task_def_arn }}
        run: |
          printf '%s\n' \
          'version: 0.0' \
          'Resources:' \
          '  - TargetService:' \
          '      Type: AWS::ECS::Service' \
          '      Properties:' \
          '        TaskDefinition: "<TASK_DEFINITION>"' \
          '        LoadBalancerInfo:' \
          '          ContainerName: "url-shortener"' \
          '          ContainerPort: 8080' \
          '        PlatformVersion: "LATEST"' \
          > appspec-final.yml
          sed -i "s|<TASK_DEFINITION>|${NEW_TASK_DEF_ARN}|g" appspec-final.yml || sed -i "" "s|<TASK_DEFINITION>|${NEW_TASK_DEF_ARN}|g" appspec-final.yml
          echo "Prepared AppSpec."

      - name: Create CodeDeploy deployment (Python escape, no jq)
        run: |
          CONTENT=$(python -c 'import json,sys;print(json.dumps(open("appspec-final.yml","r",encoding="utf-8").read()))')
          cat > revision.json <<EOF
          {
            "applicationName": "${{ steps.get-outputs.outputs.cd_app }}",
            "deploymentGroupName": "${{ steps.get-outputs.outputs.cd_group }}",
            "revision": {
              "revisionType": "AppSpecContent",
              "appSpecContent": { "content": $CONTENT }
            },
            "description": "Deployment triggered by GitHub Actions - Commit ${{ github.sha }}"
          }
          EOF
          aws deploy create-deployment --cli-input-json file://revision.json
